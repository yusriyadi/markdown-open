[package]
name = "markdown-open"
version = "1.1.0"
description = "An offline Markdown and Mermaid viewer"
authors = ["Yusriyadi"]
edition = "2021"

[lib]
name = "markdown_open_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
url = "2"

[target.'cfg(not(target_os = "android"))'.dependencies]
rfd = "0.15"
open = "5"

[dev-dependencies]
tempfile = "3"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
