[package]
name = "markdown-open"
version = "1.0.0"
description = "An offline Markdown and Mermaid viewer"
authors = ["Yusriyadi"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
url = "2"
rfd = "0.15"
open = "5"

[dev-dependencies]
tempfile = "3"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
